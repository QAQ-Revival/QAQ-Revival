        enabledFocusCursor = -1;
        hideCuteContextMenu();
        document.querySelectorAll('.mod-item.selected, .mod-gallery-item.selected').forEach(el => el.classList.remove('selected'));
        await loadMods(name);
    }

    // ===== Load & Render Mods =====
    async function loadMods(characterName, options = {}) {
        const container = document.getElementById('modList');
        const silent = !!options.silent;
        const keepFocus = options.keepFocus !== false;
        if (!silent) {
            container.innerHTML = '<div class="loading">加载中...</div>';
        } else {
            container.classList.add('soft-refreshing');
            if (keepFocus && options.focusModName) {
                prepareModFocusState(options.focusModName, {
                    scrollTop: Number.isFinite(Number(options.scrollTop)) ? Number(options.scrollTop) : container.scrollTop,
                    center: options.center
                });
            } else if (keepFocus && selectedModName && !pendingFocusState) {
                prepareModFocusState(selectedModName, { scrollTop: container.scrollTop, center: false });
            }
        }
        try {
            const result = await window.overlayApi.getMods(characterName);
            if (result.success) {
                const nextMods = Array.isArray(result.mods) ? result.mods : [];
                const nextAliases = Array.isArray(result.characterAliases) ? result.characterAliases : [];
                currentMods = nextMods;
                currentCharacterAliases = nextAliases;
                const names = new Set(currentMods.map(mod => mod.name));
                Object.entries(overlayCollectionSelections).forEach(([identity, modName]) => {
                    if (!names.has(modName)) delete overlayCollectionSelections[identity];
                });
                if (selectedModName && !names.has(selectedModName)) selectedModName = null;
                renderMods();
            } else {
                currentCharacterAliases = [];
                pendingFocusState = null;
                if (!silent) container.innerHTML = '<div class="empty-state">加载失败</div>';
                showToast(result.error || 'Mod 列表加载失败');
            }
        } catch (e) {
            pendingFocusState = null;
            if (!silent) container.innerHTML = '<div class="empty-state">加载失败</div>';
            showToast('Mod 列表加载失败');
        } finally {
            container.classList.remove('soft-refreshing');
        }
    }

    function renderMods() {
        const container = document.getElementById('modList');
        hideOnlyCuteContextMenus();
        if (overlaySettings.compatibilityMode && overlayViewMode !== 'list') {
            overlayViewMode = 'list';
        }
        // Toggle the gallery class so CSS swaps to grid layout. List mode
        // keeps the original block-flow padding via the absence of this class.
        container.classList.toggle('is-gallery', overlayViewMode === 'gallery' && !overlaySettings.compatibilityMode);
        const sorted = sortMods(currentMods);
        const displayMods = overlayCollectionsEnabled
            ? buildOverlayCollectionView(sorted, selectedChar, currentCharacterAliases)
            : sorted;
        overlayCollectionGroupsByIdentity = new Map();
        if (overlayCollectionsEnabled) {
            displayMods.forEach(mod => {
                if (mod?._collection?.identity) {
                    overlayCollectionGroupsByIdentity.set(mod._collection.identity, {
                        ...mod._collection,
                        currentName: mod.name
                    });
                }
            });
        }
        const enabledCount = currentMods.filter(m => m.enabled).length;
        document.getElementById('modCount').textContent = `${enabledCount}/${currentMods.length}`;

        if (currentMods.length === 0) {
            container.innerHTML = '<div class="empty-state">该角色没有 Mod</div>';
            syncFocusEnabledUI();
            return;
        }

        if (overlayViewMode === 'gallery') {
            // Gallery card mirrors the manager view: fixed 4:3 preview plus
            // a footer row with the mod name and enable switch.
            container.innerHTML = displayMods.map(m => {
                const collection = m._collection;
                const collectionLabel = collection ? (cleanCollectionText(m._collectionVersionLabel) || getCollectionVariantLabel(m)) : '';
                return `
                <div class="mod-gallery-item ${m.enabled ? 'enabled' : ''} ${selectedModName === m.name ? 'selected' : ''} ${collection ? 'has-collection' : ''} ${collection && openOverlayCollectionMenu === collection.identity ? 'collection-menu-open' : ''}" data-mod="${m.name}" data-enabled="${m.enabled}">
                    <div class="mod-gallery-image">
                        ${m.previewUrl ? `<img src="${m.previewUrl}" alt="" loading="lazy" onerror="this.style.display='none'">` : '<div class="mod-gallery-placeholder">📦</div>'}
                        ${m.pinned ? '<span class="mod-gallery-pin" title="已置顶">📌</span>' : ''}
                        <button class="mod-gallery-mark ${m.marked ? 'active' : ''}" data-mark-toggle="1" data-mod="${m.name}" data-marked="${m.marked}" title="${m.marked ? '取消标记' : '标记此 Mod'}">🔖</button>
                        ${m.hasConflict && m.enabled ? '<span class="mod-gallery-conflict" title="哈希冲突">⚠️</span>' : ''}
                        ${collection ? `
                            <div class="overlay-collection-dropdown" data-collection="${escapeHtml(collection.identity)}">
                                <button class="overlay-collection-trigger" data-collection-trigger="1" data-collection="${escapeHtml(collection.identity)}" title="合集：${escapeHtml(collection.name)}">
                                    <span>${escapeHtml(collectionLabel)}</span>
                                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="mod-gallery-footer">
                        <div class="mod-gallery-name" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}${collection ? ` <span class="overlay-collection-badge">${collection.variants.length}</span>` : ''}</div>
                        <div class="mod-gallery-switch ${m.enabled ? 'active' : ''}" data-toggle="1" data-mod="${m.name}" data-enabled="${m.enabled}" title="${m.enabled ? '点击禁用' : '点击启用'}"></div>
                    </div>
                </div>
            `;
            }).join('');
        } else {
            container.innerHTML = displayMods.map(m => {
                const collection = m._collection;
                return `
                <div class="mod-item ${m.enabled ? 'enabled' : ''} ${selectedModName === m.name ? 'selected' : ''}" data-mod="${m.name}" data-enabled="${m.enabled}">
                    <div class="mod-preview">
                        ${!overlaySettings.compatibilityMode && m.previewUrl ? `<img src="${m.previewUrl}" alt="">` : '📦'}
                    </div>
                    <div class="mod-info" data-action="detail">
                        <div class="mod-name">${escapeHtml(m.name)}${collection ? ` <span class="overlay-collection-badge">合集 ${collection.variants.length}</span>` : ''}${m.pinned ? ' <span class="mod-pin-icon" title="已置顶">📌</span>' : ''}${m.hasConflict && m.enabled ? ' <span class="mod-conflict-icon">⚠️</span>' : ''}</div>
                        <div class="mod-status-text">${m.enabled ? '✅ 已启用' : '⬜ 已禁用'}</div>
                        ${collection ? `
                            <div class="overlay-collection-variants">
                                ${collection.variants.map(variant => `
                                    <button class="overlay-collection-chip ${variant.name === m.name ? 'active' : ''}" data-collection-option="1" data-collection="${escapeHtml(collection.identity)}" data-mod="${escapeHtml(variant.name)}" title="${escapeHtml(variant.name)}">
                                        ${escapeHtml(getCollectionVariantLabel(variant))}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <button class="mod-mark-btn ${m.marked ? 'active' : ''}" data-mark-toggle="1" data-mod="${m.name}" data-marked="${m.marked}" title="${m.marked ? '取消标记' : '标记此 Mod'}">🔖</button>
                    <div class="toggle ${m.enabled ? 'on' : ''}" data-toggle="1" data-mod="${m.name}" data-enabled="${m.enabled}"></div>
                </div>
            `;
            }).join('');
        }

        container.querySelectorAll('[data-collection-trigger="1"]').forEach(button => {
            button.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            });
            button.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            });
            button.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                const identity = button.dataset.collection;
                if (!identity) return;
                if (openOverlayCollectionMenu === identity) {
                    closeOverlayCollectionMenus();
                    return;
                }
                showOverlayCollectionFloatingMenu(button, identity);
            });
        });

        container.querySelectorAll('[data-collection-option="1"]').forEach(option => {
            option.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            });
            option.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            });
            option.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                selectOverlayCollectionVariant(option.dataset.collection, option.dataset.mod);
            });
        });

        // Single shared toggle handler — selects both list and gallery
        // switches via the data-toggle attribute.
        container.querySelectorAll('[data-toggle="1"]').forEach(toggle => {
            toggle.addEventListener('click', async (e) => {
                e.stopPropagation();
                const modName = toggle.dataset.mod;
                const currentlyEnabled = toggle.dataset.enabled === 'true';
                try {
                    hideCuteContextMenu();
                    prepareModFocusState(modName, { scrollTop: container.scrollTop });
                    overlayLastLocalChangeAt = Date.now();
                    if (overlayExclusive && !currentlyEnabled) {
                        for (const m of currentMods) {
                            if (m.name !== modName && m.enabled) {
                                const disableResult = await window.overlayApi.toggleMod(selectedChar, m.name, false);
                                if (!disableResult.success) {
                                    pendingFocusState = null;
                                    showToast(disableResult.error || `关闭 ${m.name} 失败`);
                                    return;
                                }
                            }
                        }
                    }
                    const result = await window.overlayApi.toggleMod(selectedChar, modName, !currentlyEnabled);
                    if (result.success) {
                        trackInteraction(selectedChar, modName);
                        overlayLastLocalChangeAt = Date.now();
                        applyOptimisticModState(modName, { enabled: !currentlyEnabled });
                        if (overlayExclusive && !currentlyEnabled) {
                            currentMods = currentMods.map(mod => mod.name === modName ? mod : { ...mod, enabled: false });
                        }
                        renderMods();
                        const actionLabel = !currentlyEnabled ? '✅' : '⬜';
                        const reloadLabel = result.autoReloaded ? ' · 已自动刷新' : '';
                        const persistLabel = result.persistRestored ? ' · 已恢复配件状态' : '';
                        showToast(`${modName} ${actionLabel}${reloadLabel}${persistLabel}`);
                    } else {
                        pendingFocusState = null;
                        showToast(result.error || '切换失败');
                    }
                } catch (error) {
                    pendingFocusState = null;
                    showToast(error?.message || '切换失败');
                }
            });
        });

        container.querySelectorAll('[data-mark-toggle="1"]').forEach(button => {
            button.addEventListener('click', async (e) => {
                e.stopPropagation();
                const modName = button.dataset.mod;
                const currentlyMarked = button.dataset.marked === 'true';
                try {
                    hideCuteContextMenu();
                    prepareModFocusState(modName, { scrollTop: container.scrollTop, center: false });
                    overlayLastLocalChangeAt = Date.now();
                    const result = await window.overlayApi.setModMarked(selectedChar, modName, !currentlyMarked);
                    if (result.success) {
                        overlayLastLocalChangeAt = Date.now();
                        applyOptimisticModState(modName, { marked: !currentlyMarked });
                        renderMods();
                        showToast(currentlyMarked ? `已取消 ${modName} 的标记` : `${modName} 已标记`);
                    } else {
                        pendingFocusState = null;
                        showToast(result.error || '标记失败');
                    }
                } catch (error) {
                    pendingFocusState = null;
                    showToast(error?.message || '标记失败');
                }
            });
        });

        container.querySelectorAll('.mod-item, .mod-gallery-item').forEach(item => {
            item.addEventListener('click', (e) => {
                // Don't trigger detail-open when clicking the inline toggle/dot.
                if (e.target.closest('[data-toggle="1"]')) return;
                if (e.target.closest('[data-collection-trigger="1"], [data-collection-option="1"], .overlay-collection-dropdown, .overlay-collection-variants')) return;
                hideCuteContextMenu();
                openDetail(item.dataset.mod);
            });

            item.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showCuteContextMenu(e, item.dataset.mod);
            });
        });

        if (pendingFocusState) {
            const focusState = pendingFocusState;
            pendingFocusState = null;
            container.scrollTop = focusState.scrollTop || 0;
            requestAnimationFrame(() => focusModRow(focusState.modName, { center: focusState.center }));
        }

        syncFocusEnabledUI();
    }

    // ===== Detail Panel (side window) =====
    async function openDetail(modName) {
        const mod = currentMods.find(m => m.name === modName);
        if (!mod) {
            showToast('Mod 信息已更新，请重试');
            return;
        }

        hideCuteContextMenu();

        // Toggle off if same mod
        if (selectedModName === modName) {
            window.overlayApi.hideSide();
            selectedModName = null;
            bubbleSideOpen = false;
            document.querySelectorAll('.mod-item.selected, .mod-gallery-item.selected').forEach(el => el.classList.remove('selected'));
            return;
        }

        selectedModName = modName;
        bubbleSideOpen = false;

        const buildDetailHtml = (hotkeysHtml) => {
            let detailHtml = '';
            if (mod.previewUrl) {
                detailHtml += `<img class="detail-preview-img" src="${mod.previewUrl}" alt="">`;
            }
            detailHtml += `<div style="font-size:10px;color:#999;margin-bottom:6px;">状态: ${mod.enabled ? '✅ 已启用' : '⬜ 已禁用'} | 角色: ${escapeHtml(selectedChar)}</div>`;
            if (mod.hasConflict && mod.enabled) {
                detailHtml += `<div style="font-size:10px;color:#e67e22;background:#fff8e1;padding:4px 8px;border-radius:6px;margin-bottom:6px;">⚠️ 哈希冲突</div>`;
            }
            detailHtml += `<button class="detail-toggle-btn" id="detailMarkBtn" data-marked="${mod.marked ? 'true' : 'false'}" style="margin-bottom:8px;background:${mod.marked ? 'linear-gradient(135deg, #ff9a9e, #fecfef)' : '#f5f5f5'};color:${mod.marked ? '#fff' : '#666'};">${mod.marked ? '🏷️ 取消标记' : '🔖 标记此 Mod'}</button>`;
            detailHtml += `<div class="detail-hotkey-section">${hotkeysHtml}</div>`;
            detailHtml += `<button class="detail-toggle-btn ${mod.enabled ? 'disable' : 'enable'}" id="detailToggleBtn">${mod.enabled ? '⬜ 禁用' : '✅ 启用'}</button>`;
            return detailHtml;
        };

        const loadingHotkeysHtml = '<div style="color:#aaa;font-size:10px;text-align:center;padding:6px;">快捷键加载中...</div>';

        const sideResult = await window.overlayApi.showSide({
            content: {
                type: 'detail',
                title: mod.name,
                html: buildDetailHtml(loadingHotkeysHtml),
                charName: selectedChar,
                modName,
                modEnabled: mod.enabled,
                modMarked: !!mod.marked,
                clickableHotkeysEnabled: !!overlaySettings.clickableHotkeysEnabled
            }
        });

        if (!sideResult || !sideResult.success) {
            showToast(sideResult?.error || '打开详情失败');
            return;
        }

        document.querySelectorAll('.mod-item, .mod-gallery-item').forEach(el => el.classList.toggle('selected', el.dataset.mod === modName));

        try {
            const details = await window.overlayApi.getModDetails(selectedChar, modName);
            let hkHtml = '';
            if (details.success && details.hotkeys && details.hotkeys.length > 0) {
                hkHtml = '<div style="font-size:10px;font-weight:700;color:#555;margin-bottom:4px;">⌨️ 快捷键</div>' +
                    details.hotkeys.map((hk, index) => {
                        const desc = escapeHtml(hk.description || hk.section || '');
                        const alternatives = Array.isArray(hk.alternatives) && hk.alternatives.length > 0
                            ? hk.alternatives
                            : [{ displayKeys: Array.isArray(hk.keys) ? hk.keys : [] }];
                        const encodedPayload = encodeHotkeyPayload(hk.applyPayload || null);
                        const clickableClass = overlaySettings.clickableHotkeysEnabled ? ' clickable' : '';
                        const clickableTitle = hk.canApply
                            ? '点击应用快捷键'
                            : '当前快捷键暂不支持自动应用，点击可查看提示';
                        const clickableAttr = overlaySettings.clickableHotkeysEnabled
                            ? `role="button" tabindex="0" title="${clickableTitle}"`
                            : '';
                        const unsupportedHint = !hk.canApply
                            ? '<span class="detail-hotkey-note">当前为鼠标/手柄/特殊按键，可能需手动操作</span>'
                            : '';
                        return `
                            <div class="detail-hotkey-row${clickableClass}" ${clickableAttr} data-hotkey-index="${index}" data-hotkey-desc="${desc}" data-hotkey-payload="${encodedPayload}">
                                <span class="detail-hotkey-desc">${desc}${unsupportedHint}</span>
                                <span class="detail-hotkey-keys">${alternatives.map((alt, altIndex) => {
                                    const keys = Array.isArray(alt.displayKeys) ? alt.displayKeys : [];
                                    return `<span class="detail-hotkey-alt">${keys.map(k => `<span class="detail-kbd">${escapeHtml(k)}</span>`).join('')}</span>${altIndex < alternatives.length - 1 ? '<span class="detail-hotkey-or">或</span>' : ''}`;
                                }).join('')}</span>
                            </div>
                        `;
                    }).join('');
            } else if (details.success) {
                hkHtml = '<div style="color:#ccc;font-size:10px;text-align:center;">无快捷键</div>';
            } else {
                hkHtml = '<div style="color:#e67e22;font-size:10px;text-align:center;line-height:1.5;">快捷键读取失败，请稍后重试</div>';
                showToast(details.error || '快捷键读取失败');
            }

            window.overlayApi.updateSide({
                type: 'detail',
                title: mod.name,
                html: buildDetailHtml(hkHtml),
                charName: selectedChar,
                modName,
                modEnabled: mod.enabled,
                modMarked: !!mod.marked,
                clickableHotkeysEnabled: !!overlaySettings.clickableHotkeysEnabled
            });
        } catch (error) {
            showToast(error?.message || '快捷键读取失败');
            window.overlayApi.updateSide({
                type: 'detail',
                title: mod.name,
                html: buildDetailHtml('<div style="color:#e67e22;font-size:10px;text-align:center;line-height:1.5;">快捷键读取失败，请稍后重试</div>'),
                charName: selectedChar,
                modName,
                modEnabled: mod.enabled,
                modMarked: !!mod.marked,
                clickableHotkeysEnabled: !!overlaySettings.clickableHotkeysEnabled
            });
        }
    }

    // ===== Presets =====
    async function loadPresets() {
        const section = document.getElementById('presetSection');
        const container = document.getElementById('presetList');
        try {
            const result = await window.overlayApi.getPresets();
            if (!result.success) {
                presets = [];
                section.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            presets = Array.isArray(result.presets) ? result.presets : [];
            const activePresetId = result.activePresetId || null;
            if (presets.length === 0) {
                section.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            section.style.display = '';
            container.innerHTML = presets.map(p =>
                `<button class="preset-chip ${p.id === activePresetId ? 'active' : ''}" data-name="${p.name}">${p.name}</button>`
            ).join('');
            container.querySelectorAll('.preset-chip').forEach(chip => {
                chip.addEventListener('click', async () => {
                    try {
                        const result = await window.overlayApi.activatePreset(chip.dataset.name);
                        if (result.success) {
                            const reloadLabel = result.autoReloaded ? ' · 已自动刷新' : '';
                            showToast(`预设「${chip.dataset.name}」已应用${reloadLabel}`);
                            await loadCharacters();
                            await loadPresets();
                        } else { showToast(result.error || '应用失败'); }
                    } catch { showToast('应用失败'); }
                });
            });
        } catch {
            presets = [];
            section.style.display = 'none';
            container.innerHTML = '';
        }
    }

    async function refreshOverlayForGameChange() {
        if (overlayRefreshingForGameChange) return;
        overlayRefreshingForGameChange = true;
        try {
            bubbleSideOpen = false;
            window.overlayApi.hideSide();
            clearOverlaySelectionState();
            await loadCharacters();
            await loadPresets();
        } finally {
            overlayRefreshingForGameChange = false;
        }
    }

    // Listen for character selection from side panel
    window.overlayApi.onSelectChar((charName) => {
        const idx = characters.findIndex(c => c.name === charName);
        if (idx !== -1) {
            selectedCharIndex = idx;
            selectChar(charName);
        }
        bubbleSideOpen = false;
    });

    // Listen for cover changes from main app
    window.overlayApi.onCoversChanged(() => {
        loadCharacters();
    });

    // Reload mod list when main window toggles a mod for the current character
    window.overlayApi.onModsChanged(async (data) => {
        if (data.characterName === '__all__' || data.fullRefresh) {
            await loadCharacters({ reloadSelectedMods: false });
        }
        if (selectedChar && (data.characterName === selectedChar || data.characterName === '__all__')) {
            if (Date.now() - overlayLastLocalChangeAt < 900) return;
            loadMods(selectedChar, {
                silent: true,
                focusModName: data?.modName || selectedModName,
                center: false
            });
        }
    });

    window.overlayApi.onMarkedModsChanged((data) => {
        if (selectedChar && (!data?.characterName || data.characterName === selectedChar || data.characterName === '__all__')) {
            if (Date.now() - overlayLastLocalChangeAt < 900) return;
            loadMods(selectedChar, {
                silent: true,
                focusModName: data?.modName || selectedModName,
                center: false
            });
        }
    });

    // Listen for preset changes from main app
    window.overlayApi.onPresetsChanged(() => {
        loadPresets();
    });

    window.overlayApi.onGamesChanged(() => {
        refreshOverlayForGameChange();
    });

    window.overlayApi.onOverlayScaleChanged((data) => {
        if (data && data.scale) {
            applyOverlayScale(data.scale);
        }
    });

    window.overlayApi.onWindowShown(() => {
        syncExclusiveUI();
        hideCuteContextMenu();

        if (characters.length === 0) {
            refreshOverlayForGameChange();
        } else {
            // Mod directories may have changed while the overlay was hidden.
            loadCharacters();
        }
    });

    // Load current hotkey from config
    async function loadCurrentHotkey() {
        try {
            const result = await window.overlayApi.getHotkey();
            if (result.success && result.hotkey) {
                document.getElementById('hotkeyInput').value = result.hotkey.replace(/\+/g, ' + ');
            }
        } catch (e) { }
    }

    async function loadOverlaySettings() {
        try {
            const result = await window.overlayApi.getSettings();
            if (result.success && result.settings) {
                overlaySettings = {
                    ...overlaySettings,
                    ...result.settings
                };
            }
        } catch (e) { }
        syncSettingsUI();
    }

    // Init
    loadCharacters();
    loadPresets();
    loadCurrentHotkey();
    loadOverlaySettings();
    syncExclusiveUI();
    syncOverlayCollectionsUI();
</script>
</body>
</html>
