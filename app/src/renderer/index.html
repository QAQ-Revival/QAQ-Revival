<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QAQ-Revival</title>
    <script>
      (function bootstrapTheme() {
        var mode = "dark";
        try {
          mode = localStorage.getItem("qaqr.theme") || "dark";
        } catch {}
        var dark =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : mode !== "light";
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      })();
    </script>
    <script type="module" src="./main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
