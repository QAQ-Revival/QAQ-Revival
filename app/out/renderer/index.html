<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>QAQ-Revival</title>
  <link rel="icon" type="image/png" href="../../resources/icon.png">
  <script>
    (function bootstrapTheme() {
      try {
        var root = document.documentElement
        var skinId = localStorage.getItem('themeBootstrapSkinId')
        localStorage.removeItem('themeBootstrapCssVars')
        if (skinId !== 'aurora-premium') {
          localStorage.removeItem('themeBootstrapSkinId')
          return
        }

        root.setAttribute('data-skin', skinId)
      } catch { }
    })()
  </script>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
  <link rel="stylesheet" href="./assets/local-changes.css">
  <link rel="stylesheet" href="./assets/SettingsView.css">
</head>

<body>
  <div id="root"></div>
</body>

</html>
